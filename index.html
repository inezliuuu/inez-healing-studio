<style>
* { box-sizing:border-box; margin:0; padding:0; }

const SUPA_URL='https://pyvkydbaiwtjvqqvqsin.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB5dmt5ZGJhaXd0anZxcXZxc2luIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5NjUxMzIsImV4cCI6MjA5MDU0MTEzMn0.uttTg041PM8In_CS2Lz3xfbgQ2xX7fn8v326Dlidjas';

async function supaFetch(path,method='GET',body=null){
  const opts={method,headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':method==='POST'?'return=representation':''}};
  if(body) opts.body=JSON.stringify(body);
  const res=await fetch(SUPA_URL+'/rest/v1/'+path,opts);
  if(!res.ok){const e=await res.text();throw new Error(e);}
  const txt=await res.text();
  return txt?JSON.parse(txt):null;
}

// ══ 本地存儲 ══
const DB={
  g(k){try{const v=localStorage.getItem('theta_'+k);return v?JSON.parse(v):null;}catch{return null;}},
  s(k,v){try{localStorage.setItem('theta_'+k,JSON.stringify(v));}catch{}},
  d(k){try{localStorage.removeItem('theta_'+k);}catch{}},

}

  try{await supaFetch('cases?id=eq.'+c.id,'DELETE');await supaFetch('cases','POST',c);}catch(e){console.log('雲端儲存失敗',e);}
}
async function loadCaseFromCloud(id){
  try{
    const data=await supaFetch('cases?id=eq.'+id+'&select=*');
    if(data&&data.length){
      const c=data[0];
      if(typeof c.records==='string') try{c.records=JSON.parse(c.records);}catch(e){c.records=[];}

function getAK(){

  return 'sk-ant-api03-y53jAEBvxYvaKtgwjgNyi78SQA3-yfCPp5Myc3-4bw2VOnj5jXiHyBEXqG5Loin'+'cTglinktvy5BOxWFGvBSkyg-0kNHlwAA';

async function callAI(prompt){
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':getAK(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:2000,messages:[{role:'user',content:prompt}]})
  });
  if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e?.error?.message||'HTTP '+res.status);}
  const data=await res.json();
  const txt=data.content.map(b=>b.text||'').join('');
  const clean=txt.replace(/```json[\s\S]*?```|```[\s\S]*?```/g,s=>s.replace(/```json|```/g,'')).replace(/```json|```/g,'').trim();
  const m=clean.match(/\{[\s\S]*\}/);
  const raw=m?m[0]:clean;
  // 容錯：移除陣列中常見的格式錯誤（換行導致的逗號問題）
  const fixed=raw
    .replace(/,\s*([\]}])/g,'$1')      // 移除尾端多餘逗號
    .replace(/(["\d}])\s*\n\s*"/g,'$1,"')  // 補漏掉的逗號（字串元素）
    .replace(/\n/g,' ');               // 展平換行
  try{return JSON.parse(fixed);}
  catch(e1){
    // 第二次嘗試：用更保守的 regex 提取每個陣列並修復
    try{return JSON.parse(raw.replace(/\n/g,' ').replace(/,\s*([\]}])/g,'$1'));}
    catch(e2){throw new Error('JSON解析失敗，請重試');}
  }
}

let CUR=null,SUB='s1',DOMAIN=null,PEND_DEL=null,TMP={},SEL_LAYERS=[],ROLE='client';

// ══ 密碼 ══
const CLIENT_PW='healing';
const ADMIN_PW='inez-admin';

function checkPW(){
  const pw=document.getElementById('pw-input').value.trim();
  const name=document.getElementById('pw-name').value.trim();
  const err=document.getElementById('pw-err');
  err.style.display='none';
  if(pw===ADMIN_PW){

  } else if(pw===CLIENT_PW){

function showApp(isAdmin,clientName){

// ══ 載入或建立個案 ══
async function loadOrCreateClient(name){
  const trimName = name.trim();

  // 先從雲端用 ilike 不分大小寫查找
  try{
    const data = await supaFetch('cases?name=ilike.'+encodeURIComponent(trimName)+'&select=*');
    if(data && data.length > 0){
      CUR = data[0];
      // Supabase 有時回傳 JSON 欄位為字串，確保 parse
      if(typeof CUR.records==='string') try{CUR.records=JSON.parse(CUR.records);}catch(e){CUR.records=[];}
      if(typeof CUR.rounds==='string') try{CUR.rounds=JSON.parse(CUR.rounds);}catch(e){CUR.rounds=[];}
      if(!CUR.records)CUR.records=[];
      if(!CUR.rounds)CUR.rounds=[];
      if(CUR.rounds.length===0&&CUR.records&&CUR.records.length>0)CUR.rounds=[CUR.records];
      if(CUR.rounds.length===0)CUR.rounds.push([]);
      DB.s('case_'+CUR.id, CUR);
      const l=gList();
      if(!l.find(c=>c.id===CUR.id)){
        l.unshift({id:CUR.id,name:CUR.name,progress:CUR.progress||0,updated:CUR.updated});
        sList(l);
      }
      document.getElementById('cnv').textContent=CUR.name;
      DOMAIN=null;TMP={};SEL_LAYERS=[];
      goTab('h');
      showClientProgress();
      return;
    }
  }catch(e){console.log('雲端查找失敗，嘗試本地',e);}

  // 再從 localStorage 找（離線備援）
  const localList = gList();
  const localMatch = localList.find(c=>c.name&&c.name.toLowerCase()===trimName.toLowerCase());
  if(localMatch){
    const localCase = DB.g('case_'+localMatch.id);
    if(localCase){
      CUR = localCase;
      if(!CUR.rounds)CUR.rounds=[];
      if(CUR.rounds.length===0&&CUR.records&&CUR.records.length>0)CUR.rounds=[CUR.records];
      document.getElementById('cnv').textContent=CUR.name;
      DOMAIN=null;TMP={};SEL_LAYERS=[];
      goTab('h');showClientProgress();
      return;
    }
  }

  // 真的沒有，才建立新個案
  const id='c'+Date.now();
  CUR={id,name:trimName,progress:0,updated:new Date().toISOString(),records:[],rounds:[[]]};
  DB.s('case_'+id,CUR);
  const l=gList();l.unshift({id,name:trimName,progress:0,updated:CUR.updated});sList(l);
  await saveCaseToCloud(CUR).catch(e=>console.log(e));
  document.getElementById('cnv').textContent=trimName;
  DOMAIN=null;TMP={};SEL_LAYERS=[];
  goTab('h');showClientProgress();
}

// 查看歷史輪的結果（唯讀）
function viewRound(ri){
  const recs=(CUR.rounds||[])[ri]||[];

  let html='<div style="margin-bottom:16px;display:flex;align-items:center;gap:12px">'

    +'</div>';
  [0,1,2].forEach(function(i){
    const rec=recs[i];
    if(!rec||!rec.aiResult)return;
    const labels=['第一次｜大方向掃描','第二次｜深化聚焦','第三次｜精細清理'];
    const colors=['#7a9e7e','#6e8faf','#9e7a8e'];
    html+='<div style="border:1px solid rgba(184,150,12,.22);border-radius:5px;padding:16px;margin-bottom:10px;background:rgba(255,255,255,.5)">'
      +'<div style="font-size:10px;letter-spacing:.12em;color:'+colors[i]+';margin-bottom:8px;text-transform:uppercase">✦ '+labels[i]+'</div>';
    if(i===0&&rec.domain) html+='<div style="font-size:12px;color:var(--muted);margin-bottom:6px">領域：'+rec.domain+'</div>';
    if(rec.feel) html+='<div style="font-size:12px;color:var(--ink);margin-bottom:10px">「'+rec.feel.slice(0,60)+(rec.feel.length>60?'…':'')+'」</div>';
    const r=rec.aiResult;
    if(r){
      if(i===0&&r.表層信念&&r.表層信念.length) html+=mkCard('表層信念',r.表層信念);
      if(i===1&&r.深層信念&&r.深層信念.length) html+=mkCard('深層信念',r.深層信念);
      if(i===2&&r.清理步驟&&r.清理步驟.length){
        html+='<div class="rc"><div class="rt">清理流程</div>';
        r.清理步驟.slice(0,3).forEach(function(s,si){html+='<div style="font-size:12px;color:var(--ink);padding:4px 0;border-bottom:1px solid rgba(184,150,12,.08)">'+s.步驟名稱+'</div>';});
        html+='</div>';
      }
      if(r.下載清單&&r.下載清單.length) html+=mkDL(r.下載清單);
      if(r.飲食建議&&r.飲食建議.length) html+='<div class="rc" style="margin-top:8px"><div class="rt">🌿 飲食建議</div>'+mkUL(r.飲食建議)+'</div>';
    }
    html+='</div>';
  });
  el.innerHTML=html;
}

function startNewRound(){
  // 封存當前輪（已在 rounds 裡），開新輪
  if(!CUR.rounds)CUR.rounds=[];
  CUR.rounds.push([]); // 新的空輪
  CUR.progress=0;
  CUR.records=[];
  CUR.updated=new Date().toISOString();
  DB.s('case_'+CUR.id,CUR);
  saveCaseToCloud(CUR).catch(e=>console.log(e));
  DOMAIN=null;TMP={};SEL_LAYERS=[];
  showClientProgress();
}

function startSession(n){
  DOMAIN=null;TMP={};SEL_LAYERS=[];
  if(n===1){SUB='s1';setRail(1);}
  else if(n===2){SUB='s2';setRail(2);}
  else if(n===3){SUB='s3';setRail(3);}
  rSub();
}

async function viewSession(n){
  DOMAIN=null;TMP={};SEL_LAYERS=[];
  // 確保 records 已載入（從雲端補回）
  const recs=CUR.records||[];
  const needFetch=(n===1&&!recs[0]?.aiResult)||(n===2&&!recs[1]?.aiResult)||(n===3&&!recs[2]?.aiResult);
  if(needFetch){
    try{
      const to=new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),5000));
      const fresh=await Promise.race([loadCaseFromCloud(CUR.id),to]);
      if(fresh&&fresh.records){
        CUR.records=fresh.records;
        if(!CUR.rounds)CUR.rounds=[];
        if(CUR.rounds.length===0&&fresh.records.length>0)CUR.rounds=[fresh.records];
      }
    }catch(e){console.log('補載失敗，用現有資料',e);}
  }
  if(n===1){SUB='s1r';setRail(1);}
  else if(n===2){SUB='s2r';setRail(2);}
  else if(n===3){SUB='s3r';setRail(3);}
  rSub();
}

// ══ Rail ══
function setRail(a){
  [1,2,3].forEach(n=>{
    const el=document.getElementById('rp'+n);
    el.classList.remove('on','dn');
    if(n<a){el.classList.add('dn');el.querySelector('.rn').textContent='✓';}
    else if(n===a)el.classList.add('on');
  });
  [1,2].forEach(n=>document.getElementById('rl'+n).classList.toggle('dn',n<a));
}

// ══ 儲存進度 ══
function saveProg(p,records){
  CUR.progress=p;CUR.updated=new Date().toISOString();CUR.records=records;
  // 同步寫入 rounds（當前輪 = 最後一輪）
  if(!CUR.rounds)CUR.rounds=[];
  if(CUR.rounds.length===0)CUR.rounds.push([]);
  CUR.rounds[CUR.rounds.length-1]=records;
  DB.s('case_'+CUR.id,CUR);
  sList(gList().map(c=>c.id===CUR.id?{...c,progress:p,updated:CUR.updated}:c));
  saveCaseToCloud(CUR).catch(e=>console.log(e));
}

        +'<div id="s3tab1" onclick="sTab(\'s3\',1)" style="flex:1;padding:10px 8px;text-align:center;font-size:13px;cursor:pointer;color:var(--g);border-bottom:2px solid var(--g)">自我洞察</div>'
        +'<div id="s3tab2" onclick="sTab(\'s3\',2)" style="flex:1;padding:10px 8px;text-align:center;font-size:13px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent">完整療癒流程</div>'
        +'</div>'
        +'<div id="s3pane1">'+diagHtml+'</div>'
        +'<div id="s3pane2" style="display:none">'+flowHtml+'</div>';
    }
  }

  else if(SUB==='done'){
    el.innerHTML='<div style="text-align:center;padding:40px 20px">'
      +'<div style="font-size:44px;color:var(--g);margin-bottom:14px">✦</div>'
      +'<div style="font-size:22px;font-weight:300;color:var(--dk);margin-bottom:8px">這輪三次療癒已完成</div>'
      +'<div style="font-size:13px;color:var(--muted);line-height:1.9;margin-bottom:24px">資料已儲存。</div>'
      +(isAdmin?'<button class="bp" onclick="goTab(\'c\')">回到個案列表</button>':'<div style="font-size:13px;color:var(--muted)">感謝你完成這次療癒，期待下次與你相遇 ✦</div>')
      +'</div>';
  }
}

function sTab(p,n){
  document.getElementById(p+'pane1').style.display=n===1?'block':'none';
  document.getElementById(p+'pane2').style.display=n===2?'block':'none';
  document.getElementById(p+'tab1').style.color=n===1?'var(--g)':'var(--muted)';
  document.getElementById(p+'tab2').style.color=n===2?'var(--g)':'var(--muted)';
  document.getElementById(p+'tab1').style.borderBottomColor=n===1?'var(--g)':'transparent';
  document.getElementById(p+'tab2').style.borderBottomColor=n===2?'var(--g)':'transparent';
}

async function doAI3(){
  const belief=gv('f3b');
  if(!belief.trim()){alert('請輸入這次要清理的核心信念');return;}
  // 先存好所有輸入值
  TMP.d3={belief,layers:[...SEL_LAYERS],benefit:gv('f3bn')};
  TMP.belief=belief;TMP.benefit=gv('f3bn');
  // 先確保 records，再切換 loading 畫面（避免切換後 fetch 卡死）
  let r1=(CUR.records&&CUR.records[0])||{};
  let r2=(CUR.records&&CUR.records[1])||{};
  if(!r1.domain||!r2.body){
    try{
      const to=new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),4000));
      const fresh=await Promise.race([loadCaseFromCloud(CUR.id),to]);
      if(fresh&&fresh.records){CUR.records=fresh.records;r1=fresh.records[0]||{};r2=fresh.records[1]||{};}
    }catch(e){console.log('補載記錄略過',e);}
  }
  SUB='s3l';rSub();
  try{
    const ai3result=await callAI('你是希塔療癒的資深療癒師助手。請用繁體中文白話回答。\n背景：'+r1.domain+'領域，身體「'+r2.body+'」，情緒「'+r2.emotion+'」\n核心信念：「'+belief+'」\n層次：'+(SEL_LAYERS.join('、')||'未確認')+'\n次要獲益：'+(TMP.benefit||'無')+'\n請只回傳合法JSON，不加任何說明文字。所有字串值不得含換行字元。格式：{"清理步驟":[{"步驟名稱":"步驟名","說明":"一句話說明","引導語":"引導語文字","重點":true}],"下載清單":["下載1","下載2","下載3","下載4"],"飲食建議":["食物1及靈性意義","食物2及靈性意義"],"療癒摘要":"整體脈絡一到兩句","後續建議":"下次方向一句話"}');
    TMP.r3=ai3result;
    // 自動儲存 s3 結果
    const _recs3=CUR.records||[];
    const _rec3={belief:TMP.d3?.belief||'',layers:TMP.d3?.layers||[],benefit:TMP.d3?.benefit||'',aiResult:TMP.r3,note:''};
    saveProg(3,[_recs3[0],_recs3[1],_rec3]);
    SUB='s3r';rSub();
  }catch(e){SUB='s3';rSub();alert('分析失敗：'+e.message);}
}
